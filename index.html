<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VeriStamp | Message Verification Center</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <script src="./assets/js/crypto-core.js" defer></script>
    <script src="./assets/js/verifier.js" defer></script>
</head>
<body>

    <header>
        <div class="brand">
            <div class="brand-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            </div>
            <span class="brand-title">VeriStamp</span>
        </div>
    </header>

    <main>
        <!-- Public Verification Portal Container -->
        <div class="glass-card">
            <div class="card-icon-wrapper">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </div>
            <h1 class="card-title">Message Verification Center</h1>
            <p class="card-subtitle">Paste a VeriStamp formatted message block below to cryptographically verify its authenticity.</p>

            <div class="input-group">
                <label for="verify-input">Signed Message Block</label>
                <textarea id="verify-input" class="control-item" rows="8" placeholder="[VeriStamp Secure Message v2]&#10;ID: ...&#10;VER: 2&#10;MSG-B64: ...&#10;AUTH: ABDELWADOUD JBEL (AJ)&#10;TIME: ...&#10;HASH: ...&#10;SIG: ...&#10;VERIFY: ..."></textarea>
            </div>

            <button id="verify-btn" class="btn-primary">Verify Cryptographic Signature</button>

            <div id="verify-result" class="error-alert hidden" style="margin-top: 1.5rem; text-align: left; word-break: break-all;"></div>
        </div>
    </main>

    <footer>
        VeriStamp Cryptographic Engine &copy; 2026. <span>Zero-Trust Serverless 100%</span>
    </footer>

</body>
</html>
